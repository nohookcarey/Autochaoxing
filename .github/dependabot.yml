version: 2
updates:
  - package-ecosystem: npm
    directory: "/apps/teacher-assistant"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: "/legacy/chapter-builder"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: "/legacy/chapter-tests"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
